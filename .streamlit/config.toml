[server]
address = "localhost"      # only this computer can open the dashboard
headless = true

[client]
toolbarMode = "minimal"    # hides the menu: no Deploy button, no dark-mode switch (cards are styled for light only)

[browser]
gatherUsageStats = false

# Look of the dashboard: calm "leaf" palette, rounded cards, dark-green sidebar.
[theme]
base = "light"
primaryColor = "#1f7a4d"
backgroundColor = "#f5f7f2"
secondaryBackgroundColor = "#e9efe6"
textColor = "#1c2a22"
borderColor = "#d9e2d5"
baseRadius = "0.75rem"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
chartCategoricalColors = ["#1a7837", "#d7301f", "#2b8cbe", "#fd8d3c", "#6a51a3"]

[theme.sidebar]
backgroundColor = "#143a2a"
secondaryBackgroundColor = "#1e4d39"
textColor = "#e6f0e9"
primaryColor = "#8fd6a5"
borderColor = "#2d5c47"
